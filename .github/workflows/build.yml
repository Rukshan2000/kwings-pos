name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (installers + exe)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          base=src-tauri/target/x86_64-pc-windows-msvc/release
          cp "$base"/*.exe out/ 2>/dev/null || true
          cp "$base"/bundle/nsis/*.exe out/ 2>/dev/null || true
          cp "$base"/bundle/msi/*.msi out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: greenplus-pos-windows
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
