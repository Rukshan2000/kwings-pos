[package]
name = "greenplus-pos"
version = "0.1.0"
description = "Green Plus Argo POS — receipt billing and printing"
authors = ["Rukshan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "greenplus_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
